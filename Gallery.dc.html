<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie</title>
<meta name="description" content="Portfolio de Raphaël Doucet, photographe professionnel indépendant basé en Bretagne. Photographie sportive, événementielle, portrait, paysage et création de contenu.">
<script src="./support.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/transitions.css">
<script src="js/donnees-site.js"></script>
<script src="js/traduction.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{ rootCls }}" onContextMenu="{{ guardMenu }}">
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<p class="g-empty">Galerie en cours de préparation.</p>
</sc-if>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
<section class="g-group">
<sc-if value="{{ g.hasLabel }}" hint-placeholder-val="{{ false }}">
<div class="g-h"><span class="g-h-n">{{ g.num }}</span><h2 class="g-h-t">{{ g.label }}</h2><span class="g-h-c">{{ g.count }}</span></div>
</sc-if>
<sc-if value="{{ g.isMasonry }}" hint-placeholder-val="{{ false }}">
<div class="{{ g.masonryCls }}">
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
<figure class="tile">
<button class="tile-btn" type="button" onClick="{{ it.open }}" aria-label="{{ it.openLabel }}">
<sc-if value="{{ it.hasFile }}" hint-placeholder-val="{{ false }}"><img src="{{ it.fichier }}" alt="{{ it.alt }}" loading="lazy" decoding="async" draggable="false"></sc-if>
<sc-if value="{{ it.noFile }}" hint-placeholder-val="{{ true }}"><span class="{{ it.phCls }}" style="aspect-ratio: {{ it.ratioCss }}"><span class="ph-k">{{ it.phLabel }}</span><span class="ph-id">{{ it.id }}</span></span></sc-if>
</button>
<sc-if value="{{ it.hasCaption }}" hint-placeholder-val="{{ false }}"><figcaption class="cap">{{ it.caption }}</figcaption></sc-if>
</figure>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ g.isJustified }}" hint-placeholder-val="{{ false }}">
<div class="justified">
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="8">
<figure class="jitem" style="flex-grow: {{ it.grow }}; flex-basis: {{ it.basis }}px">
<button class="tile-btn" type="button" onClick="{{ it.open }}" aria-label="{{ it.openLabel }}">
<sc-if value="{{ it.hasFile }}" hint-placeholder-val="{{ false }}"><img src="{{ it.fichier }}" alt="{{ it.alt }}" loading="lazy" decoding="async" draggable="false"></sc-if>
<sc-if value="{{ it.noFile }}" hint-placeholder-val="{{ true }}"><span class="{{ it.phCls }}" style="aspect-ratio: {{ it.ratioCss }}"><span class="ph-k">{{ it.phLabel }}</span><span class="ph-id">{{ it.id }}</span></span></sc-if>
</button>
</figure>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ g.isPortraits }}" hint-placeholder-val="{{ false }}">
<div class="portraits">
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
<figure class="tile">
<button class="tile-btn" type="button" onClick="{{ it.open }}" aria-label="{{ it.openLabel }}">
<sc-if value="{{ it.hasFile }}" hint-placeholder-val="{{ false }}"><img src="{{ it.fichier }}" alt="{{ it.alt }}" loading="lazy" decoding="async" draggable="false"></sc-if>
<sc-if value="{{ it.noFile }}" hint-placeholder-val="{{ true }}"><span class="{{ it.phCls }}" style="aspect-ratio: {{ it.ratioCss }}"><span class="ph-k">{{ it.phLabel }}</span><span class="ph-id">{{ it.id }}</span></span></sc-if>
</button>
<sc-if value="{{ it.hasCaption }}" hint-placeholder-val="{{ false }}"><figcaption class="cap">{{ it.caption }}</figcaption></sc-if>
</figure>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ g.isImmersive }}" hint-placeholder-val="{{ false }}">
<div class="bz">
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
<figure class="{{ it.bzCls }}">
<button class="tile-btn" type="button" onClick="{{ it.open }}" aria-label="{{ it.openLabel }}">
<sc-if value="{{ it.hasFile }}" hint-placeholder-val="{{ false }}"><img src="{{ it.fichier }}" alt="{{ it.alt }}" loading="lazy" decoding="async" draggable="false"></sc-if>
<sc-if value="{{ it.noFile }}" hint-placeholder-val="{{ true }}"><span class="{{ it.phCls }}" style="aspect-ratio: {{ it.ratioCss }}"><span class="ph-k">{{ it.phLabel }}</span><span class="ph-id">{{ it.id }}</span></span></sc-if>
</button>
<sc-if value="{{ it.hasCaption }}" hint-placeholder-val="{{ false }}"><figcaption class="cap">{{ it.caption }}</figcaption></sc-if>
</figure>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ g.isCover }}" hint-placeholder-val="{{ false }}">

<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="1">
<figure class="cover">
<button class="tile-btn" type="button" onClick="{{ it.open }}" aria-label="{{ it.openLabel }}">
<sc-if value="{{ it.hasFile }}" hint-placeholder-val="{{ false }}"><img src="{{ it.fichier }}" alt="{{ it.alt }}" loading="lazy" decoding="async" draggable="false"></sc-if>
<sc-if value="{{ it.noFile }}" hint-placeholder-val="{{ true }}"><span class="{{ it.phCls }}" style="aspect-ratio: {{ it.ratioCss }}"><span class="ph-k">{{ it.phLabel }}</span><span class="ph-id">{{ it.id }}</span></span></sc-if>
</button>
</figure>
</sc-for>

</sc-if>
</section>
</sc-for>

<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
<div class="lb" role="dialog" aria-modal="true" aria-label="Visionneuse photo — Échap pour fermer" tabIndex="-1" ref="{{ lbRef }}" onKeyDown="{{ lbKey }}">
<div class="lb-top">
<span>{{ lb.count }}</span>
<button class="lb-btn lb-close" type="button" aria-label="Fermer la photo" title="Fermer (Échap)" onClick="{{ closeLb }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="lb-stage" onTouchStart="{{ touchStart }}" onTouchEnd="{{ touchEnd }}">
<sc-if value="{{ lb.multi }}" hint-placeholder-val="{{ true }}"><button class="lb-btn lb-nav lb-prev" type="button" aria-label="Image précédente" onClick="{{ prevLb }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button></sc-if>
<figure class="lb-fig">
<sc-if value="{{ lb.hasFile }}" hint-placeholder-val="{{ false }}"><img class="lb-img" src="{{ lb.fichier }}" alt="{{ lb.alt }}" draggable="false"></sc-if>
<sc-if value="{{ lb.noFile }}" hint-placeholder-val="{{ true }}"><span class="ph ph-dark lb-ph" style="aspect-ratio: {{ lb.ratioCss }}"><span class="ph-k">Photo à importer</span><span class="ph-id">{{ lb.id }}</span></span></sc-if>
</figure>
<sc-if value="{{ lb.multi }}" hint-placeholder-val="{{ true }}"><button class="lb-btn lb-nav lb-next" type="button" aria-label="Image suivante" onClick="{{ nextLb }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></sc-if>
</div>
<div class="lb-cap">
<sc-if value="{{ lb.hasTitle }}" hint-placeholder-val="{{ false }}"><span class="lb-t">{{ lb.titre }}</span></sc-if>
<sc-if value="{{ lb.hasMeta }}" hint-placeholder-val="{{ false }}"><span class="lb-m">{{ lb.meta }}</span></sc-if>
<sc-if value="{{ lb.hasDesc }}" hint-placeholder-val="{{ false }}"><p class="lb-d">{{ lb.description }}</p></sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"source": {"editor": "text", "default": "categorie:sport"}, "layout": {"editor": "enum", "options": ["masonry", "masonry2", "justified", "portraits", "immersive", "cover"], "default": "masonry"}, "group": {"editor": "enum", "options": ["", "serie", "lieu"], "default": ""}, "tone": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 1440, "height": 1200}}'>
/* Galerie réutilisable + visionneuse plein écran.
   source : 'categorie:<nom>' | 'libre:<nom>' (photos hors reportage) | 'projet:<id>' | 'photo:<id>'
   layout : masonry | masonry2 | justified | portraits | immersive | cover
   group  : '' | 'serie' | 'lieu'  (chapitres, affichés seulement si renseignés)
   tone   : light | dark */
const GENRE = { sport: 'sportive', evenementiel: 'événementielle', portrait: 'de portrait', bretagne: 'de Bretagne', animalier: 'animalière' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lb: null };
    this._list = [];
    this._tx = null;
    /* Visionneuse : focus à l’ouverture pour que Échap et les flèches fonctionnent */
    this._lbRef = (el) => { if (el && el !== this._lbEl) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } this._lbEl = el; };
    this._lbKey = (e) => {
      if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); e.stopPropagation(); this.setState({ lb: null }); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); this.step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); this.step(-1); }
    };
  }
  step(d) {
    const n = this._list.length;
    if (this.state.lb == null || n < 2) return;
    this.setState({ lb: (this.state.lb + d + n) % n });
  }
  renderVals() {
    const D = window.RD || { photos: [], projets: [] };
    const photos = D.photos || [];
    const src = String(this.props.source || 'categorie:sport');
    const layout = String(this.props.layout || 'masonry');
    const groupBy = String(this.props.group || '');
    const dark = this.props.tone === 'dark';
    const byId = {};
    photos.forEach((p) => { byId[p.id] = p; });

    let raw = [];
    let pr = null;
    if (src.indexOf('categorie:') === 0) { const c = src.slice(10); raw = photos.filter((p) => p.categorie === c); }
    else if (src.indexOf('libre:') === 0) { const c = src.slice(6); raw = photos.filter((p) => p.categorie === c && !p.projet); }
    else if (src.indexOf('projet:') === 0) {
      const id = src.slice(7);
      pr = (D.projets || []).find((x) => x.id === id) || {};
      raw = photos.filter((p) => p.projet === id);
    }
    else if (src.indexOf('photo:') === 0) { const p = byId[src.slice(6)]; raw = p ? [p] : []; }
    /* Site public : seules les photos réellement importées sont affichées (aucun emplacement vide). */
    raw = raw.filter((p) => p && p.fichier);

    /* Chapitres */
    let order = [];
    if (groupBy) {
      const pref = (groupBy === 'serie' && pr && pr.series) ? pr.series : [];
      pref.forEach((k) => { if (raw.some((p) => p[groupBy] === k)) order.push(k); });
      raw.forEach((p) => { const k = p[groupBy]; if (k && order.indexOf(k) < 0) order.push(k); });
    }
    const labelled = order.length > 0;
    const rest = raw.filter((p) => !labelled || !p[groupBy] || order.indexOf(p[groupBy]) < 0);
    const buckets = labelled ? order.map((k) => ({ label: k, list: raw.filter((p) => p[groupBy] === k) })) : [];
    if (rest.length) buckets.push({ label: labelled ? (groupBy === 'lieu' ? 'Autres lieux' : 'Autres images') : '', list: rest });

    const phCls = dark ? 'ph ph-dark' : (layout === 'portraits' ? 'ph ph-sand' : 'ph');
    const flat = [];
    const pad = (n) => String(n).padStart(2, '0');
    const prep = (p) => {
      const i = flat.length;
      const has = !!p.fichier;
      const meta = [p.lieu, p.date].filter(Boolean).join(' · ');
      const caption = p.titre ? [p.titre, meta].filter(Boolean).join(' — ') : '';
      const genre = GENRE[p.categorie] ? 'Photographie ' + GENRE[p.categorie] : 'Photographie';
      const alt = p.alt || [p.titre || genre, p.lieu, 'Raphaël Doucet'].filter(Boolean).join(' — ');
      const parts = String(p.ratio || '3/2').split('/').map(Number);
      const w = parts[0] || 3, h = parts[1] || 2, r = w / h;
      const it = Object.assign({}, p, {
        titre: p.titre || '', description: p.description || '',
        hasFile: has, noFile: !has, meta: meta, hasMeta: !!meta,
        caption: caption, hasCaption: !!caption, hasTitle: !!p.titre, hasDesc: !!p.description,
        alt: alt, ratioCss: w + ' / ' + h, grow: Math.round(r * 100), basis: Math.round(r * 250),
        bzCls: p.format === 'plein' ? 'bz-item full' : 'bz-item',
        phCls: phCls, phLabel: layout === 'cover' ? 'Image d’ouverture à importer' : 'Photo à importer',
        openLabel: 'Afficher en grand : ' + alt,
        open: () => this.setState({ lb: i })
      });
      flat.push(it);
      return it;
    };
    const groups = buckets.map((b, gi) => ({
      label: b.label, hasLabel: !!b.label, num: pad(gi + 1),
      count: b.list.length + ' image' + (b.list.length > 1 ? 's' : ''),
      items: b.list.map(prep),
      isMasonry: layout === 'masonry' || layout === 'masonry2',
      masonryCls: layout === 'masonry2' ? 'masonry two' : 'masonry',
      isJustified: layout === 'justified', isPortraits: layout === 'portraits',
      isImmersive: layout === 'immersive', isCover: layout === 'cover'
    }));
    this._list = flat;

    let lb = {};
    let lbOpen = false;
    if (this.state.lb != null && flat.length) {
      const i = Math.max(0, Math.min(this.state.lb, flat.length - 1));
      lb = Object.assign({}, flat[i], { count: pad(i + 1) + ' / ' + pad(flat.length), multi: flat.length > 1 });
      lbOpen = true;
    }

    return {
      rootCls: dark ? 'g-dark' : '',
      groups: groups, isEmpty: flat.length === 0,
      lb: lb, lbOpen: lbOpen,
      closeLb: () => this.setState({ lb: null }),
      lbRef: this._lbRef, lbKey: this._lbKey,
      prevLb: () => this.step(-1),
      nextLb: () => this.step(1),
      touchStart: (e) => { const t = e.touches && e.touches[0]; this._tx = t ? t.clientX : null; },
      touchEnd: (e) => {
        const t = e.changedTouches && e.changedTouches[0];
        if (this._tx == null || !t) return;
        const dx = t.clientX - this._tx;
        this._tx = null;
        if (Math.abs(dx) > 50) this.step(dx < 0 ? 1 : -1);
      },
      guardMenu: (e) => { if (e && e.target && e.target.tagName === 'IMG') e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
